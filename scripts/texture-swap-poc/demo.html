<!DOCTYPE html>
<html>
<head>
  <title>Texture Swap PoC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #eee; font-family: system-ui, sans-serif; }
    .container { display: flex; gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; }
    .canvas-wrap { flex: 1; position: relative; }
    canvas { width: 100%; display: block; background: #222; }
    .controls { width: 280px; flex-shrink: 0; }
    h1 { font-size: 18px; margin-bottom: 16px; font-weight: 500; }
    h2 { font-size: 14px; margin: 16px 0 8px; font-weight: 500; color: #999; text-transform: uppercase; letter-spacing: 0.05em; }
    .surface-control { margin-bottom: 12px; }
    .surface-control label { display: block; font-size: 13px; margin-bottom: 4px; }
    .surface-control select { width: 100%; padding: 6px 8px; background: #222; color: #eee; border: 1px solid #444; font-size: 13px; }
    .color-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .color-swatch { width: 32px; height: 32px; border: 2px solid transparent; cursor: pointer; }
    .color-swatch.active { border-color: #fff; }
    .status { font-size: 12px; color: #666; margin-top: 20px; }
    .blend-control { margin-top: 16px; }
    .blend-control input[type=range] { width: 100%; }
    .blend-control label { font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>
    <div class="controls">
      <h1>Texture Swap PoC</h1>

      <div class="blend-control">
        <label>Blend: <span id="blend-value">70</span>%</label>
        <input type="range" id="blend" min="0" max="100" value="70">
      </div>

      <h2>Surfaces</h2>
      <div id="surface-controls"></div>
      <div class="status" id="status">Loading...</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Surface definitions with color options
    const SURFACES = [
      {
        id: 'perimeter-cabinets',
        label: 'Perimeter Cabinets',
        maskFile: 'output/mask-gemini-perimeter-cabinets.png',
        colors: [
          { name: 'Original', hex: null },
          { name: 'White', hex: '#F5F5F0' },
          { name: 'Navy', hex: '#2C3E50' },
          { name: 'Sage', hex: '#8B9D83' },
          { name: 'Walnut', hex: '#5C4033' },
          { name: 'Black', hex: '#1A1A1A' },
          { name: 'Cream', hex: '#F5E6C8' },
        ]
      },
      {
        id: 'island-cabinets',
        label: 'Island Cabinets',
        maskFile: 'output/mask-gemini-island-cabinets.png',
        colors: [
          { name: 'Original', hex: null },
          { name: 'White', hex: '#F5F5F0' },
          { name: 'Navy', hex: '#2C3E50' },
          { name: 'Sage', hex: '#8B9D83' },
          { name: 'Walnut', hex: '#5C4033' },
          { name: 'Black', hex: '#1A1A1A' },
          { name: 'Blue', hex: '#3D5A80' },
        ]
      },
      {
        id: 'countertop',
        label: 'Countertop',
        maskFile: 'output/mask-gemini-countertop.png',
        colors: [
          { name: 'Original', hex: null },
          { name: 'White Marble', hex: '#E8E4DE' },
          { name: 'Dark Granite', hex: '#3A3A3A' },
          { name: 'Butcher Block', hex: '#C4956A' },
          { name: 'Concrete', hex: '#999999' },
        ]
      },
      {
        id: 'backsplash',
        label: 'Backsplash',
        maskFile: 'output/mask-gemini-backsplash.png',
        colors: [
          { name: 'Original', hex: null },
          { name: 'White Subway', hex: '#F0EDE8' },
          { name: 'Blue Tile', hex: '#5B7C99' },
          { name: 'Green Tile', hex: '#7D9B76' },
          { name: 'Dark Gray', hex: '#4A4A4A' },
        ]
      },
      {
        id: 'floor',
        label: 'Flooring',
        maskFile: 'output/mask-gemini-floor.png',
        colors: [
          { name: 'Original', hex: null },
          { name: 'Light Oak', hex: '#C9A96E' },
          { name: 'Dark Walnut', hex: '#5C4033' },
          { name: 'Gray Wash', hex: '#9E9E9E' },
          { name: 'Espresso', hex: '#3C2415' },
          { name: 'White Oak', hex: '#D4C5A9' },
        ]
      },
      {
        id: 'walls',
        label: 'Wall Paint',
        maskFile: 'output/mask-gemini-walls.png',
        colors: [
          { name: 'Original', hex: null },
          { name: 'White', hex: '#F5F5F0' },
          { name: 'Warm Gray', hex: '#D5CEC5' },
          { name: 'Sage', hex: '#C5CFC0' },
          { name: 'Navy', hex: '#2C3E50' },
          { name: 'Cream', hex: '#F5E6C8' },
        ]
      },
    ];

    // State
    let sourceImage = null;
    const masks = {};
    const selections = {};
    let blendAmount = 0.7;

    // Load an image as a promise
    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    // Render the composite
    function render() {
      if (!sourceImage) return;

      const w = canvas.width;
      const h = canvas.height;

      // Draw original photo
      ctx.drawImage(sourceImage, 0, 0, w, h);

      // For each surface with a non-original selection, apply color through mask
      for (const surface of SURFACES) {
        const hex = selections[surface.id];
        if (!hex) continue;

        const maskImg = masks[surface.id];
        if (!maskImg) continue;

        // Create offscreen canvas for the mask
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = w;
        maskCanvas.height = h;
        const maskCtx = maskCanvas.getContext('2d');
        maskCtx.drawImage(maskImg, 0, 0, w, h);
        const maskData = maskCtx.getImageData(0, 0, w, h);

        // Get current canvas state
        const imageData = ctx.getImageData(0, 0, w, h);
        const pixels = imageData.data;

        // Parse hex color
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);

        // Blend color into masked areas using multiply blend mode
        // This preserves the original lighting/shadows while changing the base color
        for (let i = 0; i < pixels.length; i += 4) {
          const maskValue = maskData.data[i]; // Red channel of mask (grayscale)
          if (maskValue < 128) continue;

          const origR = pixels[i];
          const origG = pixels[i + 1];
          const origB = pixels[i + 2];

          // Calculate luminance of original pixel to preserve lighting
          const lum = (origR * 0.299 + origG * 0.587 + origB * 0.114) / 255;

          // Apply new color modulated by original luminance
          const newR = Math.round(r * lum);
          const newG = Math.round(g * lum);
          const newB = Math.round(b * lum);

          // Blend between original and recolored
          pixels[i] = Math.round(origR * (1 - blendAmount) + newR * blendAmount);
          pixels[i + 1] = Math.round(origG * (1 - blendAmount) + newG * blendAmount);
          pixels[i + 2] = Math.round(origB * (1 - blendAmount) + newB * blendAmount);
        }

        ctx.putImageData(imageData, 0, 0);
      }
    }

    // Build UI controls
    function buildControls() {
      const container = document.getElementById('surface-controls');

      for (const surface of SURFACES) {
        selections[surface.id] = null;

        const div = document.createElement('div');
        div.className = 'surface-control';

        const label = document.createElement('label');
        label.textContent = surface.label;
        div.appendChild(label);

        const colorRow = document.createElement('div');
        colorRow.className = 'color-row';

        for (const color of surface.colors) {
          const swatch = document.createElement('div');
          swatch.className = 'color-swatch' + (color.hex === null ? ' active' : '');
          swatch.style.background = color.hex || 'linear-gradient(135deg, #333 25%, #555 25%, #555 50%, #333 50%, #333 75%, #555 75%)';
          swatch.style.backgroundSize = color.hex ? 'auto' : '8px 8px';
          swatch.title = color.name;

          swatch.onclick = () => {
            // Update active state
            colorRow.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
            swatch.classList.add('active');

            selections[surface.id] = color.hex;
            render();
          };

          colorRow.appendChild(swatch);
        }

        div.appendChild(colorRow);
        container.appendChild(div);
      }
    }

    // Init
    async function init() {
      const status = document.getElementById('status');

      status.textContent = 'Loading source image...';
      sourceImage = await loadImage('output/source.png');

      // Set canvas to match image aspect ratio
      canvas.width = sourceImage.naturalWidth;
      canvas.height = sourceImage.naturalHeight;

      status.textContent = 'Loading masks...';
      for (const surface of SURFACES) {
        try {
          masks[surface.id] = await loadImage(surface.maskFile);
        } catch (e) {
          console.warn(`Failed to load mask: ${surface.maskFile}`);
        }
      }

      buildControls();

      // Blend slider
      const blendSlider = document.getElementById('blend');
      const blendLabel = document.getElementById('blend-value');
      blendSlider.oninput = () => {
        blendAmount = blendSlider.value / 100;
        blendLabel.textContent = blendSlider.value;
        render();
      };

      status.textContent = `Ready — ${Object.keys(masks).length} masks loaded. Click a color to swap.`;
      render();
    }

    init().catch(err => {
      document.getElementById('status').textContent = 'Error: ' + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
